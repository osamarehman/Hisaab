inherit_gem:
  rubocop-rails-omakase: rubocop.yml

Layout/IndentationWidth:
  Enabled: true

Layout/IndentationStyle:
  EnforcedStyle: spaces
  IndentationWidth: 2

Layout/IndentationConsistency:
  Enabled: true

Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: true

Layout/SpaceInsideArrayLiteralBrackets:
  Exclude:
    - "db/schema.rb"

# mobile/ is the Flutter app; RuboCop would otherwise parse its .arb
# translation files as Ruby (Arbre templates share the extension).
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "mobile/**/*"
